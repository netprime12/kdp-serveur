<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réglages — ReviewScout</title>
<style>
  :root{--bg:#0f1b16;--card:#16281f;--line:#26483a;--txt:#eef4f0;--muted:#9db6a9;--gold:#d4a63c}
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font:14px/1.6 -apple-system,Segoe UI,Roboto,Arial,sans-serif;
    max-width:600px;margin:0 auto;padding:28px 20px}
  h1{font-size:20px;display:flex;align-items:center;gap:10px}
  .logo{width:34px;height:34px;border-radius:8px;object-fit:contain;vertical-align:middle}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:18px}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 5px}
  input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#0e1712;color:var(--txt)}
  .btns{display:flex;gap:10px;margin-top:16px}
  button{padding:10px 16px;border:none;border-radius:8px;cursor:pointer;font-weight:700}
  #save{background:linear-gradient(135deg,var(--gold),#b8860b);color:#241a00}
  #check{background:var(--card);border:1px solid var(--line);color:var(--txt)}
  .msg{margin-top:12px;font-size:13px;color:var(--gold)}
  .hint{font-size:12px;color:var(--muted);margin-top:8px}
  .hint a{color:var(--gold)}
</style>
</head>
<body>
  <h1><img class="logo" src="icons/icon128.png" alt="ReviewScout"> Réglages ReviewScout</h1>
  <div class="card">
    <label for="license">Clé de licence (reçue après ton abonnement ou l'achat d'un pack)</label>
    <input id="license" placeholder="XXXX-XXXX-XXXX-XXXX">

    <label for="lang">Langue</label>
    <select id="lang">
      <option value="auto">Auto (langue du navigateur)</option>
      <option value="fr">Français</option>
      <option value="en">English</option>
    </select>

    <details style="margin-top:14px">
      <summary style="cursor:pointer;color:var(--muted)">Avancé</summary>
      <label for="server">URL du serveur (laisser vide — réglé automatiquement)</label>
      <input id="server" placeholder="https://kdp-serveur.onrender.com">
    </details>

    <div class="btns">
      <button id="save">Enregistrer</button>
      <button id="check">Vérifier ma licence</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="hint" id="buy"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
