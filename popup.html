<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg:#0f1b16; --card:#16281f; --line:#26483a; --txt:#eef4f0;
    --muted:#9db6a9; --accent:#2f6f4f; --gold:#d4a63c; --bad:#e8825a; --good:#5fbf85;
  }
  *{box-sizing:border-box}
  body{width:420px; margin:0; background:var(--bg); color:var(--txt);
    font:13.5px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
  header{display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line)}
  header img.logo{width:30px;height:30px;border-radius:7px}
  header h1{font-size:14px;margin:0;font-weight:700}
  header .sub{font-size:10.5px;color:var(--muted)}
  header .gear{margin-left:auto;cursor:pointer;color:var(--muted);font-size:17px;background:none;border:none}
  header .gear:hover{color:var(--txt)}
  .pad{padding:12px 14px}
  button.primary{width:100%;padding:11px;border:none;border-radius:8px;cursor:pointer;
    background:linear-gradient(135deg,var(--gold),#b8860b);color:#241a00;font-weight:800;font-size:14px}
  button.primary:disabled{opacity:.6;cursor:default}
  .note{font-size:12px;color:var(--muted);margin:10px 0}
  .note a{color:var(--gold)}
  .row{display:flex;gap:8px;margin-top:10px}
  .row button{flex:1;padding:9px;border:1px solid var(--line);background:var(--card);color:var(--txt);
    border-radius:8px;cursor:pointer;font-size:12.5px}
  .row button:hover{border-color:var(--gold)}
  .cards{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .stat{flex:1;min-width:78px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
  .stat .v{font-size:18px;font-weight:800}
  .stat .l{font-size:10.5px;color:var(--muted)}
  h2{font-size:13px;margin:16px 0 6px;color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:4px}
  ul{margin:6px 0;padding-left:18px} li{margin:4px 0}
  .freq{font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;background:#3a2418;color:#f0c8a0;margin-left:6px}
  .verb{background:var(--card);border-left:3px solid var(--gold);border-radius:6px;padding:7px 9px;margin:6px 0;font-style:italic}
  .verb b{font-style:normal;color:var(--gold);display:block;font-size:11px;margin-bottom:2px}
  .err{background:#3a1e18;border:1px solid #7a3a2a;border-radius:8px;padding:10px;color:#f0c0b0;font-size:12.5px}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #ffffff55;border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  [hidden]{display:none!important}
</style>
</head>
<body>
  <header>
    <img class="logo" src="icons/icon128.png" alt="ReviewScout">
    <div>
      <h1>ReviewScout</h1>
      <div class="sub" id="sub">Analyse d'avis Amazon</div>
    </div>
    <button class="gear" id="gear" title="Réglages">⚙️</button>
  </header>

  <div class="pad">
    <button class="primary" id="go">🔍 Analyser les avis</button>
    <div class="note" id="quota"></div>
    <div class="note" id="buy" hidden></div>

    <div id="status" hidden></div>
    <div id="result" hidden>
      <div class="row">
        <button id="csv">⬇ Tableau CSV</button>
        <button id="html">⬇ Rapport HTML</button>
      </div>
      <div id="render"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
